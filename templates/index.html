<!DOCTYPE html>
<html>
<head>
    <title>Quantum Password Generator</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 2.5rem;
            color: #38bdf8;
            text-shadow: 0 0 15px #38bdf8;
        }

        .container {
            margin: 40px auto;
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(56,189,248,0.3);
        }

        input {
            width: 80%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
            box-shadow: 0 0 15px #38bdf8;
        }

        #password {
            margin-top: 20px;
            font-size: 22px;
            color: #22c55e;
            word-break: break-all;
        }

        .strength {
            margin-top: 10px;
        }

        .loading {
            margin-top: 15px;
            color: #38bdf8;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>

<h1>Quantum Password Generator</h1>

<div class="container">
    <p>Password Length</p>
    <input type="number" id="length" value="10" min="4" max="32">

    <br>
    <button onclick="generatePassword()">Generate</button>

    <div class="loading" id="loading"></div>

    <div id="password"></div>
    <div class="strength" id="strength"></div>

    <button onclick="copyPassword()">Copy</button>
</div>

<script>
function generatePassword() {
    let length = document.getElementById("length").value;

    document.getElementById("loading").innerText = "Generating quantum randomness...";
    document.getElementById("password").innerText = "";

    fetch("/generate", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ length: length })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("loading").innerText = "";

        let pwd = data.password;
        document.getElementById("password").innerText = pwd;

        checkStrength(pwd);
    });
}

function copyPassword() {
    let text = document.getElementById("password").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}

function checkStrength(pwd) {
    let strength = "Weak";

    if (pwd.length >= 10 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) {
        strength = "Strong";
    } else if (pwd.length >= 8) {
        strength = "Medium";
    }

    document.getElementById("strength").innerText = "Strength: " + strength;
}
</script>

</body>
</html>
